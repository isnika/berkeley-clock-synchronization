name: macOS portable client
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build BerkeleyTimeSync.CrossPlatform.sln -c Release
      - run: dotnet test BerkeleyTimeSync.CrossPlatform.sln -c Release --no-build --logger trx
      # Deliberately no sudo/real clock changes on a shared CI runner.
      - run: bash scripts/publish-macos.sh osx-arm64
      - run: bash scripts/publish-macos.sh osx-x64
      - uses: actions/upload-artifact@v4
        with:
          name: BerkeleyTimeSync-macos-lab
          path: artifacts/crossplatform/*.zip
